<style>
  :root{
    --red:#e10600; --red-deep:#c40800;
    --bg:#070708; --panel:#131316; --line:#232329;
    --text:#f2f2f4; --dim:#9a9aa2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #2a0505 0%, var(--bg) 55%);
    color:var(--text);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:48px 20px 32px;
  }
  .logo{
    width:120px;height:120px;border-radius:27px;
    box-shadow:0 12px 40px rgba(225,6,0,.35), 0 2px 8px rgba(0,0,0,.6);
    margin-bottom:28px;
  }
  h1{
    font-size:44px; letter-spacing:.12em; font-weight:800; text-align:center;
  }
  h1 span{color:var(--red)}
  .tag{
    margin-top:10px; color:var(--dim); font-size:17px; text-align:center; letter-spacing:.02em;
  }
  .tag b{color:var(--text); font-weight:600}
  .buttons{
    margin-top:44px; display:flex; flex-direction:column; gap:16px; width:100%; max-width:340px;
  }
  .store-btn{
    display:flex; align-items:center; justify-content:center; gap:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px 22px; text-decoration:none; color:var(--text);
    transition:transform .15s ease, border-color .15s ease;
  }
  .store-btn:active{transform:scale(.97)}
  .store-btn:hover{border-color:var(--red)}
  .store-btn svg{width:30px;height:30px;flex:none}
  .store-btn .txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .store-btn .small{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .store-btn .big{font-size:19px;font-weight:700}
  .store-btn.soon{opacity:.45; pointer-events:none}
  .store-btn.soon .big{font-size:17px}
  .contact{
    margin-top:34px;
  }
  .contact a{
    display:inline-block; background:var(--red); color:#fff; text-decoration:none;
    font-weight:700; letter-spacing:.08em; font-size:15px;
    padding:14px 44px; border-radius:999px;
